plugins {
    id 'java-library'
    id 'jacoco'
    id 'maven-publish'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

// Javadoc jar generation is opt-in to keep dev builds working on machines
// without a full JDK installed. Enable for Maven Central publishing with
// `-PenableJavadocJar=true` or set the project property in CI.
if (project.hasProperty('enableJavadocJar')) {
    java {
        withJavadocJar()
    }
}

repositories {
    mavenCentral()
}

ext {
    jacksonVersion = '2.17.2'
    junitVersion = '5.10.3'
    assertjVersion = '3.26.3'
    wiremockVersion = '3.9.1'
    slf4jVersion = '2.0.13'
}

dependencies {
    api "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    api "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"

    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
    testImplementation "org.wiremock:wiremock:${wiremockVersion}"
    testImplementation "org.slf4j:slf4j-simple:${slf4jVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
            excludes = [
                'org.maviance.smobilpay.model.*',
            ]
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

javadoc {
    options.encoding = 'UTF-8'
    if (JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
    options.addStringOption('Xdoclint:none', '-quiet')
    // Don't fail the build if the local JDK lacks the javadoc tool (e.g.
    // dev environments with only a JRE installed). CI environments with a
    // full JDK still produce complete docs.
    failOnError = false
}

// --- Smoke-test harness ---------------------------------------------------
// Standalone runner that exercises the client against a real partner
// environment. Not part of the published library — kept in its own source
// set so the runtime/test classpaths stay clean.

sourceSets {
    samples {
        java.srcDirs = ['src/samples/java']
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    samplesImplementation.extendsFrom implementation, api
    samplesRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    samplesImplementation sourceSets.main.output
    samplesRuntimeOnly "org.slf4j:slf4j-simple:${slf4jVersion}"
}

tasks.register('runSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Run the Smobilpay smoke-test harness against a real partner environment. Reads config from --args="<path>", $SMOBILPAY_SMOKE_CONFIG, or ./smoke-test.json. See smoke-test.example.json.'
    classpath = sourceSets.samples.runtimeClasspath
    mainClass = 'org.maviance.smobilpay.samples.SmokeTest'
    standardInput = System.in
    // Forward SMOBILPAY_SMOKE_CONFIG so the harness picks up the explicit
    // path override when set; the JSON config file carries everything else.
    environment System.getenv()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'smobilpay-java-client'
                description = 'Java client library for the Smobilpay partner API (v3.2.0).'
                url = 'https://github.com/maviance/smobilpay-java'
                licenses {
                    license {
                        name = 'Proprietary'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        name = 'Maviance Developer Relations'
                        email = 'support@smobilpay.com'
                        organization = 'Maviance'
                        organizationUrl = 'https://www.maviance.com'
                    }
                }
            }
        }
    }
}
